<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эврика КГ - Урок 1: Примитивы Java</title>
    <style>
        /* Современная палитра и стили для комфортного обучения */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --success: #22c55e;
            --warning: #eab308;
            --code-bg: #020617;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .lesson-container {
            width: 100%;
            max-width: 750px;
            margin: 20px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Шапка с прогрессом и управлением звуком */
        .lesson-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-title {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 600;
        }

        .audio-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .audio-btn:hover {
            background-color: #475569;
        }

        .audio-btn.playing {
            background-color: var(--warning);
            color: #000;
        }

        /* Стили шкалы прогресса */
        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--success);
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-width: 90px;
            text-align: right;
        }

        /* Область контента карточки */
        .lesson-body {
            padding: 30px;
            min-height: 250px;
        }

        .card-title {
            margin-top: 0;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .card-text {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        /* Выделение кода */
        pre {
            background-color: var(--code-bg);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border-left: 4px solid var(--primary);
            margin: 15px 0;
        }

        code {
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        /* Блок предупреждений/важных заметок */
        .alert-box {
            background-color: rgba(234, 179, 8, 0.1);
            border-left: 4px solid var(--warning);
            padding: 12px 15px;
            border-radius: 4px;
            margin-top: 15px;
            color: #fef08a;
        }

        /* Панель навигации внизу */
        .lesson-footer {
            padding: 20px;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
        }

        .nav-btn {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
        }

        .nav-btn:disabled {
            background-color: #334155;
            color: var(--text-muted);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="lesson-container">
    <div class="lesson-header">
        <div class="header-top">
            <h4 class="lesson-title">Урок 1: Переменные и примитивы</h4>
            <button class="audio-btn" id="audioBtn" onclick="toggleSpeech()">
                <span id="audioIcon">🔊</span> <span id="audioText">Слушать</span>
            </button>
        </div>
        <div class="progress-wrapper">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span class="progress-text" id="progressText">0% Пройдено</span>
        </div>
    </div>

    <div class="lesson-body" id="lessonBody">
        </div>

    <div class="lesson-footer">
        <button class="nav-btn" id="prevBtn" onclick="changeStep(-1)">Назад</button>
        <button class="nav-btn" id="nextBtn" onclick="changeStep(1)">Далее</button>
    </div>
</div>

<script>
    // База данных карточек для Урока 1 (сформирована из твоего текстового файла)
    const lessonSteps = [
        {
            title: "1. Что такое переменная?",
            text: "Переменная в Java — это именованная область памяти, в которой хранится значение определённого типа. Компилятор и JVM строго следят за безопасностью: нельзя случайно положить текст в переменную для чисел.",
            code: "int age;\nage = 25; // инициализация\n\n// Или в одну строку:\ndouble price = 19.99;",
            alert: "ВАЖНО: Локальные переменные (внутри методов) не имеют значений по умолчанию. Комплятор выдаст ошибку, если попробовать прочесть пустую переменную."
        },
        {
            title: "2. Целочисленные примитивы",
            text: "В Java есть 8 примитивных типов. Они хранят чистые значения прямо в быстрой памяти (стеке). Целых чисел четыре разновидности: byte (8 бит), short (16 бит), int (32 бита) и long (64 бита).",
            code: "int money = 2000000; \nlong stars = 3_000_000_000L; // Суффикс L обязателен для больших чисел!",
            alert: "Тип 'int' — это стандарт по умолчанию. JVM оптимизирована для работы с 32-битными числами."
        },
        {
            title: "3. Числа с плавающей точкой",
            text: "Для дробных чисел применяются типы float (32 бит) и double (64 бит). Double — это стандартный выбор по умолчанию.",
            code: "double pi = 3.14159;\nfloat weight = 70.5f; // Суффикс f обязателен!",
            alert: "КРИТИЧЕСКИЙ НЮАНС: Дробные числа могут иметь погрешность округления в двоичной системе (например, 0.1 + 0.2 даст 0.30000000000000004). Никогда не используйте их для денег! Для финансов есть класс BigDecimal."
        },
        {
            title: "4. Символы (char) и Логика (boolean)",
            text: "Тип char (16 бит) хранит один символ Unicode и записывается в одинарных кавычках. В арифметике он ведет себя как число. Тип boolean хранит только true (истина) или false (ложь).",
            code: "char letter = 'A';\nchar symbol = '\\u00A9'; // Символ копирайта ©\n\nboolean isJavaHard = false;",
            alert: "В отличие от языков C/C++, в Java нельзя заменить boolean числами 0 или 1."
        },
        {
            title: "5. Приведение типов данных",
            text: "Автоматическое приведение происходит, когда мы переносим данные из меньшего типа в больший (например, из int в long). Если мы хотим сделать наоборот, нужно использовать явное приведение типов (кастинг), беря на себя риск потери данных.",
            code: "int big = 100;\nbyte small = (byte) big; // Явное приведение типов",
            alert: "При переполнении типа число уйдет в минус или исказится, будьте аккуратны!"
        },
        {
            title: "6. Типичные ошибки новичков",
            text: "Запомните три главных правила, чтобы не ломать код на старте:\n1. При делении целых чисел дробная часть отбрасывается, а не округляется (5 / 2 будет ровно 2).\n2. Не забывайте ставить буквы 'f' у float и 'L' у long.\n3. Никогда не сравнивайте дробные double через двойное равно (==).",
            code: "int x = 5 / 2; // результат: 2\n\n// Правильное сравнение double:\nMath.abs(a - b) < 0.0001",
            alert: "Изучите эти правила, они уберегут вас от часов бесполезной отладки."
        }
    ];

    let currentStep = 0;
    let isSpeaking = false;
    let synth = window.speechSynthesis;
    let currentUtterance = null;

    // Функция обновления карточки на экране
    function updateCard() {
        const step = lessonSteps[currentStep];
        const body = document.getElementById('lessonBody');
        
        // Формируем внутренний HTML карточки
        let html = `<h2 class="card-title">${step.title}</h2>`;
        html += `<p class="card-text">${step.text.replace(/\n/g, '<br>')}</p>`;
        
        if (step.code) {
            html += `<pre><code>${escapeHtml(step.code)}</code></pre>`;
        }
        if (step.alert) {
            html += `<div class="alert-box"><strong>💡 Заметка:</strong> ${step.alert}</div>`;
        }
        
        body.innerHTML = html;

        // Кнопки управления навигацией
        document.getElementById('prevBtn').disabled = currentStep === 0;
        document.getElementById('nextBtn').innerText = currentStep === lessonSteps.length - 1 ? "Завершить" : "Далее";

        // Обновление шкалы прогресса
        const progressPercent = ((currentStep + 1) / lessonSteps.length) * 100;
        document.getElementById('progressBar').style.width = `${progressPercent}%`;
        document.getElementById('progressText').innerText = `${Math.round(progressPercent)}% Пройдено`;

        // Если включали озвучку, при переключении шага останавливаем её
        if (isSpeaking) {
            stopSpeech();
        }
    }

    // Изменение шага (Вперед / Назад)
    function changeStep(direction) {
        if (direction === 1 && currentStep === lessonSteps.length - 1) {
            alert("Поздравляем! Вы полностью изучили теорию первого урока. Скоро добавим практику!");
            return;
        }
        
        currentStep += direction;
        if (currentStep < 0) currentStep = 0;
        if (currentStep >= lessonSteps.length) currentStep = lessonSteps.length - 1;
        
        updateCard();
    }

    // Управление озвучкой (Чтение текста)
    function toggleSpeech() {
        if (isSpeaking) {
            stopSpeech();
        } else {
            startSpeech();
        }
    }

    function startSpeech() {
        if (!synth) {
            alert("Ваш браузер не поддерживает озвучку текста.");
            return;
        }

        const step = lessonSteps[currentStep];
        // Синтезируем чистый текст для чтения (без кода и спецсимволов)
        const textToRead = `${step.title}. ${step.text} ${step.alert ? step.alert : ''}`;

        currentUtterance = new SpeechSynthesisUtterance(textToRead);
        currentUtterance.lang = 'ru-RU';
        currentUtterance.rate = 1.0; // Скорость чтения

        currentUtterance.onend = function() {
            stopSpeech();
        };

        currentUtterance.onerror = function() {
            stopSpeech();
        };

        synth.speak(currentUtterance);
        isSpeaking = true;
        
        // Меняем внешний вид кнопки
        document.getElementById('audioBtn').classList.add('playing');
        document.getElementById('audioIcon').innerText = "⏹️";
        document.getElementById('audioText').innerText = "Стоп";
    }

    function stopSpeech() {
        if (synth) {
            synth.cancel();
        }
        isSpeaking = false;
        document.getElementById('audioBtn').classList.remove('playing');
        document.getElementById('audioIcon').innerText = "🔊";
        document.getElementById('audioText').innerText = "Слушать";
    }

    // Вспомогательная функция для безопасного отображения кода
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Инициализация при загрузке страницы
    window.onload = function() {
        updateCard();
    };
</script>

</body>
</html>
